<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms!</title>
</head>
<body>

    <p>Text</p>
    <input type="text">
    <p>Email</p>
    <input type="email" name="" id="">
    <p>Password</p>
    <input type="password">
    <p>Number</p>
    <input type="number">
    <p>Date</p>
    <input type="date">
    <p>Date and Time</p>
    <input type="datetime-local">

    <p>Radio Buttons!</p>

    <input type="radio">

    <p>CheckBox</p>

    <input type="checkbox">

    <p>Drop Downs</p>

    <select name="" id="">

        <option value="">India</option>
        <option value="">Pakistan</option>
        <option value="">Bangladesh</option>


    </select>


    <p>Comment Section</p>

    <textarea name="" id=""></textarea>


    <p>Text</p>

    <input type="text" placeholder="Type your name" name="fullname" maxlength="15"  >


    <h1>Personal Form!</h1>

    <form action="./server.html" method="get" > 

        <label for="fullname">
            Full Name:
            <input type="text" placeholder="Type Your Full Name!" id="fullname" name="fullName" required >
        </label> <br><br>

        <label for="email">
            Email:
            <input type="email" id="email" placeholder="Type your enmail" required name="email">
        </label> <br><br>

        <label for="password">
            Password:
            <input type="password" id="password" required name="password" placeholder="Type your password">
        </label><br><br>

        <label for="">Gender</label> 
        <label for="male">
            <input type="radio" id="male" name="gender" value="male">
            Male
        </label>
        <label for="female">
            <input type="radio" id="female" name="gender" value="female">
            Female
        </label> <br><br>

        <label for="">Hobbies</label>
        <label for="Gaming">
            <input type="checkbox" name="hobbies" value="Gaming" id="Gaming">
            Gaming
        </label>
        <label for="sports">
            <input type="checkbox" name="hobbies" value="sports" id="sports">
            Sports
        </label>
        <label for="cooking">
            <input type="checkbox" name="hobbies" value="cooking" id="cooking">
            Cooking
        </label>
        <label for="Sketching">
            <input type="checkbox" name="hobbies" value="Sketching" id="Sketching">
            Sketching
        </label> <br><br>

        <select name="" id="">
            <option selected disabled>Select your course!</option>
            <option value="Web and App">Web and App</option>
            <option value="Graphic Designing">Graphic Designing</option>
            <option value="animation">animation</option>
        </select> <br><br>

        <input type="submit" value="Submit your Form">






    </form>

    <button>Submit!</button>


    <br>
    <br>
    <br>


    <fieldset>

        <legend>Personal Form</legend>

        <form action="">
            <label for="">
                Name:
                <input type="text">
            </label>
                Password
                <input type="text">
            </label>
        </form>

    </fieldset>



    <br>
    <br>
    <br>
    <br>
    <br>
    <br>

</body>
</html>
